# Default values for thread-route-updater
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/rafaelgaspar/unifi-thread-route-updater
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# Optional VLAN16 macvlan attachment (Multus NAD + pod annotation).
# Requires kube-system/cni-dhcp when dhcp is true, plus a matching UniFi reservation.
vlan16:
  enabled: false
  # NAD name; defaults to <release-name>-vlan16.
  name: ""
  # Pod interface name for the secondary network.
  interface: eth1
  master: br16
  # Pinned locally-administered MAC — required when enabled.
  mac: ""
  dhcp: true
  # Static IPAM (when dhcp is false).
  address: ""
  gateway: 192.168.16.1
  routes: []
  tuning:
    sysctls: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: thread-route-updater.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Configuration for the application
config:
  # Logging level (DEBUG, INFO, WARN, ERROR)
  logLevel: "INFO"

  # Network interface to use for mDNS queries.
  # When using Multus, set this to the secondary interface name (e.g. "net1").
  # Leave empty to use all interfaces.
  mdnsInterface: "eth1"

  # Ubiquiti router configuration
  ubiquiti:
    enabled: true
    hostname: "unifi.local.rafaelgaspar.xyz"
    username: "thread-route-updater"
    insecureSSL: false
    # Gateway device MAC address (required for adding static routes)
    gatewayDevice: ""

  # Home Assistant configuration (optional — enables Thread prefix discovery via HA API)
  homeAssistant:
    url: ""
    insecureSSL: false

# Secrets for sensitive configuration
secrets:
  # Create a new secret (default behavior)
  create: true

  # Ubiquiti router password
  ubiquitiPassword: ""

  # Home Assistant long-lived access token (optional)
  haToken: ""

  # Secret name (used for both created and existing secrets)
  secretName: ""

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network policy
networkPolicy:
  enabled: false

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
